[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stg-ddqn-simulator"
version = "1.0.0"
description = "Paper-aligned STG-DDQN simulator for vehicular SFC placement and continuity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "torch>=2.1",
]

[project.optional-dependencies]
sumo = ["traci>=1.19", "sumolib>=1.19"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["stg_ddqn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

